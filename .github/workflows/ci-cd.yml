name: CI/CD

on:
  push:
    branches: [main, master, develop, habit_tracker]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-line-length=99 --exclude=migrations,venv,.venv --exit-zero --statistics

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-at-least-32-characters!!
          DEBUG: 'True'
          TELEGRAM_BOT_TOKEN: test-token
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
        run: |
          python manage.py test --verbosity=1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/habit_tracker')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH || '~/habit_tracker' }}
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            source venv/bin/activate || python3 -m venv venv && source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart habit_tracker || sudo systemctl restart gunicorn || true
            sudo systemctl restart celery || true
            sudo systemctl restart celery-beat || true
            echo "Deploy finished at $(date)"
